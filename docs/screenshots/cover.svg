<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041210"/>
      <stop offset="50%" stop-color="#08231d"/>
      <stop offset="100%" stop-color="#040e0b"/>
    </linearGradient>
    <radialGradient id="aurora-m1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora-m2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="emeraldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-m)"/>
  <rect width="1200" height="675" fill="url(#aurora-m1)"/>
  <rect width="1200" height="675" fill="url(#aurora-m2)"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Central Glassmorphic Card -->
  <rect x="100" y="75" width="1000" height="525" rx="32" fill="url(#cardGrad-m)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- App Icon Glow & Icon -->
  <circle cx="210" cy="180" r="55" fill="#10b981" fill-opacity="0.2" filter="blur(20px)"/>
  <rect x="160" y="130" width="100" height="100" rx="24" fill="#08201a" stroke="#34d399" stroke-width="2"/>
  
  <!-- Network Mesh Icon Drawing -->
  <circle cx="190" cy="165" r="7" fill="#34d399"/>
  <circle cx="230" cy="165" r="7" fill="#34d399"/>
  <circle cx="210" cy="195" r="9" fill="#38bdf8"/>
  <line x1="190" y1="165" x2="230" y2="165" stroke="#34d399" stroke-width="2.5"/>
  <line x1="190" y1="165" x2="210" y2="195" stroke="#34d399" stroke-width="2.5"/>
  <line x1="230" y1="165" x2="210" y2="195" stroke="#34d399" stroke-width="2.5"/>

  <!-- Badges Top Right -->
  <rect x="910" y="115" width="140" height="38" rx="19" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
  <text x="980" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">v1.4.0 Windows</text>

  <!-- Titles -->
  <text x="290" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#emeraldText)" letter-spacing="-0.5">Esteban Mesh Office</text>
  <text x="290" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Plataforma Empresarial de Red y Colaboración para 10+ PCs</text>

  <!-- Main Feature Preview Grid -->
  <g transform="translate(150, 270)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="270" height="150" rx="20" fill="#081d18" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="25" y="45" font-family="system-ui, sans-serif" font-size="28">🌐</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Descubrimiento LAN</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Detección instantánea de puestos de trabajo sin configurar servidores</text>

    <!-- Feature 2 -->
    <rect x="315" y="0" width="270" height="150" rx="20" fill="#081d18" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="340" y="45" font-family="system-ui, sans-serif" font-size="28">📊</text>
    <text x="340" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Inventario Hardware</text>
    <text x="340" y="115" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Auditoría en vivo de CPU, RAM, GPU, discos y SO de toda la flota</text>

    <!-- Feature 3 -->
    <rect x="630" y="0" width="270" height="150" rx="20" fill="#081d18" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="655" y="45" font-family="system-ui, sans-serif" font-size="28">💬</text>
    <text x="655" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Chat Departamental</text>
    <text x="655" y="115" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Canales seguros por departamento y envío rápido de archivos masivos</text>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(150, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="90" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ WinScript Studio</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="210" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="305" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">📁 Auto-Letra D: a Z:</text>

    <!-- Pill 3 -->
    <rect x="430" y="0" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="540" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">🛡️ Aprovisionamiento USB</text>

    <!-- Author link -->
    <text x="890" y="26" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#34d399" text-anchor="end">Hecho por Esteban Nicola · estebanico.com</text>
  </g>
</svg>